name: Build Enterprise POS 3D APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Ensure Android SDK 34 is available
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK and generated Drift files
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-pos-chad3d-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            lib/main.g.dart
